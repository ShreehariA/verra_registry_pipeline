# Streamlit settings for `make dashboard` and the Docker image. Nothing leaves the machine:
[browser]
gatherUsageStats = false   # no usage statistics sent to Streamlit's makers

[server]
headless = true            # no first-run prompt asking for an email address; `make dashboard` prints the URL
fileWatcherType = "none"   # the app reads the lake, not its own source: no need to watch files
enableStaticServing = true # serves dashboard/static/: the Public Sans font, so no font is fetched from Google

[logger]
hideWelcomeMessage = true  # the welcome text looks up this machine's public IP address online

[client]
toolbarMode = "viewer"     # no "Deploy" button or developer menu for people viewing the dashboard

# The look (notes/dashboard-plan.md): a public ledger. Ink for text and controls, so the only saturated
# colours are the three fates of a credit: retired, cancelled, available (validated with the dataviz skill).
[[theme.fontFaces]]
family = "Public Sans"
url = "app/static/PublicSans-Variable.ttf"
weight = "100 900"

[theme]
font = "Public Sans, sans-serif"
headingFontSizes = ["2rem", "1.375rem", "1.125rem", "1rem", "0.875rem", "0.75rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "3rem"     # the one hero figure per page: 48px
metricValueFontWeight = 650
baseRadius = "small"
paddingTop = "1.5rem"
paddingBottom = "3rem"

[theme.light]
primaryColor = "#22313a"
textColor = "#22313a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f6"
borderColor = "#dce1e3"
linkColor = "#22313a"
dataframeHeaderBackgroundColor = "#f4f6f6"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.dark]
primaryColor = "#c9d6dc"
textColor = "#e6ecee"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1f27"
borderColor = "#2e3540"
linkColor = "#c9d6dc"
dataframeHeaderBackgroundColor = "#1a1f27"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#0ca30c", "#9085e9", "#e66767"]
