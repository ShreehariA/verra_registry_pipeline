# Checks and tests on every push to main and every pull request. Nothing is deployed from here.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # exact: setup-uv publishes no major tag such as v10
        with:
          version: "0.11.19"
          enable-cache: true
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: Lint
        run: make lint
      - name: Types
        run: make types
      - name: Tests
        run: make test
  terraform:
    name: Terraform format and validity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"
      - name: Format
        run: terraform -chdir=deploy fmt -check
      - name: Validate, offline
        run: |
          terraform -chdir=deploy init -backend=false
          terraform -chdir=deploy validate
